<section class="public-section">


    <div class="page-heading">

        <p class="section-label">
            COMMUNITY ACTIVITY
        </p>

        <h1>
            Live Service Network
        </h1>

        <p>
            Anonymized service activity across the cooperative network.
        </p>

    </div>


    <div id="publicBookings"
         class="public-bookings">

    </div>


</section>


<script src="script.js"></script>


<script>


// ------------------------------------------
// PUBLIC BOOKING DATABASE
// ------------------------------------------

function loadPublicBookings() {

    const container =
        document.getElementById(
            "publicBookings"
        );


    if (!container) return;


    const bookings =
        JSON.parse(
            localStorage.getItem(
                "sahayaBookings"
            )
        ) || [];


    if (bookings.length === 0) {

        container.innerHTML = `

            <div class="empty-bookings">

                <div class="empty-icon">
                    📊
                </div>

                <h3>
                    No active bookings
                </h3>

                <p>
                    New community service requests
                    will appear here.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    bookings.forEach(function(booking) {


        const card =
            document.createElement("div");


        card.className =
            "public-booking-card";


        card.innerHTML = `

            <div class="public-top">

                <div>

                    <span class="booking-id">
                        ${booking.bookingID}
                    </span>

                    <h3>
                        ${getServiceIcon(booking.service)}
                        ${booking.service}
                    </h3>

                </div>


                <span class="live-status">

                    ● ${booking.status}

                </span>

            </div>


            <div class="public-details">

                <p>
                    📍 ${booking.location}
                </p>

                <p>
                    📅 ${booking.date}
                </p>

                <p>
                    ⏰ ${booking.time}
                </p>

                <p>
                    👷 ${booking.worker}
                </p>

                <p>
                    🚗 ETA:
                    ${booking.eta}
                </p>

            </div>


            <div class="privacy-note">

                🔒 Customer information is protected.

                Exact address, phone number and
                personal details are never displayed
                publicly.

            </div>

        `;


        container.appendChild(card);

    });

}


// ------------------------------------------
// INITIAL LOAD
// ------------------------------------------

loadPublicBookings();


// ------------------------------------------
// REAL-TIME UPDATE
// ------------------------------------------

window.addEventListener(
    "storage",
    function(event) {

        if (
            event.key ===
            "sahayaBookings"
        ) {

            loadPublicBookings();

        }

    }
);

</script>


</body>
